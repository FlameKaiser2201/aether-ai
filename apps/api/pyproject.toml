[project]
name = "aether-api"
version = "1.0.0"
description = "AETHER API — voice-first AI workspace"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "uvicorn[standard]>=0.34.0,<1.0",
  "pydantic>=2.10.4,<3.0",
  "pydantic-settings>=2.7.0,<3.0",
  "email-validator>=2.2.0,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30.0,<1.0",
  "aiosqlite>=0.20.0,<1.0",
  "alembic>=1.14.0,<2.0",
  "redis>=5.2.1,<6.0",
  "httpx>=0.28.1,<1.0",
  "PyJWT>=2.10.1,<3.0",
  "argon2-cffi>=23.1.0,<26.0",
  "python-multipart>=0.0.20,<1.0",
  "bleach>=6.2.0,<7.0",
  "pypdf>=5.1.0,<6.0",
  "python-docx>=1.1.2,<2.0",
  "openpyxl>=3.1.5,<4.0",
  "pillow>=11.1.0,<13.0",
  "sqlparse>=0.5.3,<1.0",
  "beautifulsoup4>=4.12.3,<5.0",
  "charset-normalizer>=3.4.1,<4.0",
  "tree-sitter>=0.24.0,<0.26",
  "tree-sitter-language-pack>=0.7.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0",
  "pytest-asyncio>=0.25.2,<1.0",
  "ruff>=0.8.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/core/config.py" = ["S104", "S105"]
"app/main.py" = ["S104"]
"app/schemas/auth.py" = ["S105"]
"app/core/security.py" = ["S105"]
