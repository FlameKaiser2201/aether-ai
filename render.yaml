# Render Blueprint — https://render.com/docs/blueprint-spec
# Two Docker services (Next.js web + FastAPI API) and a managed PostgreSQL.
# Redis is optional; create a Render Key Value instance and paste REDIS_URL.
databases:
  - name: aether-db
    databaseName: aether
    user: aether
    plan: free
    region: oregon

services:
  - type: web
    name: aether-api
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_API_DOCS
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: APP_URL
        value: https://aether-web.onrender.com
      - key: API_URL
        value: https://aether-api.onrender.com
      - key: CORS_ORIGINS
        value: https://aether-web.onrender.com
      - key: TRUSTED_HOSTS
        value: aether-api.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: aether-web
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: ./apps/web
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://aether-web.onrender.com
      - key: NEXTAUTH_URL
        value: https://aether-web.onrender.com
      - key: API_URL
        value: https://aether-api.onrender.com
